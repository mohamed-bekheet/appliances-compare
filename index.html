<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقارنة الأجهزة الكهربائية</title>
<style>
:root {
  --orange: #e8560a;
  --orange-light: #fff3e0;
  --dark: #1a1a2e;
  --gray: #f4f6f9;
  --border: #e0e0e0;
  --text: #2d2d2d;
  --muted: #777;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--gray); color: var(--text); font-size: 14px; }

/* ── Header ── */
header {
  background: linear-gradient(135deg, var(--dark) 0%, #2d1b69 100%);
  color: #fff; padding: 18px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex-wrap: wrap;
}
header h1 { font-size: 1.25rem; }
header p  { font-size: 0.78rem; opacity: .75; margin-top: 2px; }
.header-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.hbadge { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
  color: #fff; border-radius: 20px; padding: 3px 10px; font-size: .72rem; white-space: nowrap; }

/* ── Tabs ── */
.tabs { background: var(--dark); display: flex; gap: 2px; padding: 0 24px; overflow-x: auto; }
.tab { color: rgba(255,255,255,.55); padding: 10px 16px; cursor: pointer; font-size: .82rem;
  border-bottom: 3px solid transparent; white-space: nowrap; transition: .2s; }
.tab:hover { color: #fff; }
.tab.active { color: #fff; border-color: var(--orange); }

/* ── Controls bar ── */
.controls {
  background: #fff; padding: 12px 20px; display: flex; gap: 10px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 20;
  box-shadow: 0 2px 10px rgba(0,0,0,.1); border-bottom: 2px solid var(--orange);
}
.ctrl { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 130px; }
.ctrl label { font-size: .7rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.ctrl select, .ctrl input {
  padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .82rem; font-family: inherit; background: #fafafa;
}
.ctrl select:focus, .ctrl input:focus { border-color: var(--orange); outline: none; background: #fff; }
.ctrl-row { display: flex; gap: 6px; align-items: flex-end; }
.ctrl-row.range { flex-wrap: nowrap !important; }
.ctrl-row.range input { flex: 1 1 0; width: 0; min-width: 0; }
.ms { position: relative; }
.qhint { font-size: .7rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; align-items: center; }
.qhint span { background: #e8f5e9; color: #2e7d32; border-radius: 10px; padding: 1px 7px; }
.qhint a { color: var(--orange); cursor: pointer; font-weight: 600; }
.more-wrap { text-align: center; margin: 14px 0 24px; }
.relax { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; align-items: center; font-size: .85rem; }
.relax button { border: 1px solid var(--orange); background: #fff; color: var(--orange); border-radius: 16px; padding: 5px 12px; cursor: pointer; font-family: inherit; font-size: .8rem; }
.relax button:hover { background: var(--orange); color: #fff; }
.ms-btn { width: 100%; text-align: right; padding: 7px 26px 7px 10px; border: 1.5px solid var(--border); border-radius: 8px;
  font: inherit; font-size: .82rem; background: #fafafa; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  position: relative; }
.ms-btn::after { content: '▾'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.ms-btn.on { border-color: var(--orange); background: var(--orange-light); font-weight: 600; }
.ms-panel { display: none; position: absolute; top: calc(100% + 4px); right: 0; z-index: 50; background: #fff; min-width: 240px;
  border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 8px; }
.ms.open .ms-panel { display: block; }
.ms-panel.flip { right: auto; left: 0; }
.ms-panel { max-width: calc(100vw - 16px); }
.ms-panel input[type=search] { width: 100%; padding: 6px 8px; border: 1.5px solid var(--border); border-radius: 7px; font: inherit; font-size: .8rem; }
.ms-acts { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px; font-size: .74rem; gap: 6px; }
.ms-acts a { color: var(--orange); cursor: pointer; font-weight: 600; }
.ms-mode { color: var(--muted); }
.ms-list { max-height: 280px; overflow-y: auto; }
.ms-opt { text-transform: none !important; letter-spacing: normal !important; font-weight: 400 !important; color: var(--text) !important; display: flex; align-items: center; gap: 7px; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: .82rem; }
.ms-opt:hover { background: #f5f5f5; }
.ms-opt .cnt { margin-right: auto; color: var(--muted); font-size: .72rem; }
.ms-opt.zero { opacity: .45; }
.presets { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.presets button { border: 1px solid var(--border); background: #fff; border-radius: 12px; padding: 2px 8px; font-size: .68rem; cursor: pointer; font-family: inherit; }
.presets button.on { background: var(--orange); color: #fff; border-color: var(--orange); }
.fchip .x { cursor: pointer; margin-right: 4px; opacity: .6; }
.fchip .x:hover { opacity: 1; }
.btn {
  padding: 7px 14px; border: none; border-radius: 8px; cursor: pointer;
  font-size: .78rem; font-weight: 600; white-space: nowrap;
}
.btn-orange { background: var(--orange); color: #fff; }
.btn-gray   { background: var(--border); color: var(--text); }

/* ── Stats bar ── */
.stats {
  background: var(--orange-light); padding: 8px 20px;
  display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
  border-bottom: 1px solid #ffd180; font-size: .78rem;
}
.stat-item { display: flex; gap: 5px; align-items: center; }
.stat-val  { color: var(--orange); font-weight: 700; font-size: .9rem; }
.stat-lbl  { color: var(--muted); }

/* ── View toggle ── */
.view-toggle { margin-right: auto; display: flex; gap: 4px; }
.vbtn { padding: 4px 10px; border: 1.5px solid var(--border); border-radius: 6px;
  background: #fff; cursor: pointer; font-size: .75rem; }
.vbtn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

/* ── Main content ── */
main { padding: 16px 20px; }

/* ── TABLE VIEW ── */
.table-wrap { overflow-x: auto; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
table { width: 100%; border-collapse: collapse; background: #fff; min-width: 1000px; }
thead { background: var(--dark); color: #fff; }
thead th {
  padding: 10px 12px; font-size: .75rem; font-weight: 600;
  white-space: nowrap; cursor: pointer; user-select: none;
}
thead th:hover { background: #2a2a4a; }
thead th .sort-arrow { margin-right: 4px; opacity: .5; }
thead th.sorted .sort-arrow { opacity: 1; }
tbody tr { border-bottom: 1px solid #f0f0f0; transition: background .15s; }
tbody tr:hover { background: #fff8f3; }
tbody td { padding: 9px 12px; font-size: .81rem; vertical-align: middle; }
tbody tr.best-deal td:first-child { border-right: 3px solid #ffc107; }

/* ── CARD VIEW ── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card {
  background: #fff; border-radius: 12px; padding: 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.07); border: 1.5px solid transparent;
  transition: .2s; position: relative; overflow: hidden;
}
.card:hover { border-color: var(--orange); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.card-brand { font-weight: 700; font-size: .9rem; }
.card-cat { font-size: .7rem; color: var(--muted); margin-top: 2px; }
.card-name { font-size: .82rem; color: var(--text); margin-bottom: 10px; line-height: 1.4; }
.card-specs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.card-price { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.card-price-after  { font-size: 1.1rem; font-weight: 700; color: var(--orange); }
.card-price-before { font-size: .78rem; text-decoration: line-through; color: var(--muted); }
.card-tech { font-size: .72rem; color: #555; line-height: 1.5; border-top: 1px solid #f0f0f0; padding-top: 8px; }
.best-corner {
  position: absolute; top: 10px; left: 10px;
  background: #ffc107; color: #333; font-size: .65rem; font-weight: 700;
  padding: 2px 6px; border-radius: 4px;
}

/* ── Shared elements ── */
.brand-badge {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: .7rem; font-weight: 700; color: #fff; background: #546e7a; white-space: nowrap;
}
.disc-badge {
  background: var(--orange); color: #fff; border-radius: 20px;
  padding: 2px 8px; font-size: .72rem; font-weight: 700; white-space: nowrap;
}
.price-after  { color: var(--orange); font-weight: 700; }
.price-before { color: var(--muted); text-decoration: line-through; font-size: .75rem; display: block; }
.tag {
  display: inline-block; padding: 2px 6px; border-radius: 4px;
  font-size: .68rem; background: #e3f2fd; color: #1565c0;
}
.tag.green  { background: #e8f5e9; color: #2e7d32; }
.tag.orange { background: var(--orange-light); color: #e65100; }
.tag.purple { background: #f3e5f5; color: #6a1b9a; }

/* ── Empty state ── */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty svg { margin-bottom: 12px; opacity: .3; }

/* ── Comparison panel ── */
.compare-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--dark); color: #fff; padding: 10px 20px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  transform: translateY(100%); transition: .3s;
  box-shadow: 0 -4px 20px rgba(0,0,0,.3);
}
.compare-bar.visible { transform: translateY(0); }
.compare-items { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.compare-chip {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
  border-radius: 20px; padding: 4px 10px; font-size: .75rem;
  display: flex; align-items: center; gap: 6px;
}
.compare-chip button { background: none; border: none; color: #fff; cursor: pointer; font-size: .9rem; line-height: 1; }

/* ── Compare table modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 200; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: #fff; border-radius: 16px; padding: 24px;
  max-width: 95vw; max-height: 90vh; overflow: auto;
  min-width: 320px;
}
.modal h2 { font-size: 1rem; margin-bottom: 16px; color: var(--dark); }
.modal-close { float: left; background: var(--border); border: none; border-radius: 6px;
  padding: 4px 10px; cursor: pointer; font-size: .8rem; }
.cmp-table { border-collapse: collapse; width: 100%; }
.cmp-table th { background: var(--dark); color: #fff; padding: 8px 14px; font-size: .78rem; white-space: nowrap; }
.cmp-table td { padding: 8px 14px; border-bottom: 1px solid #f0f0f0; font-size: .8rem; }
.cmp-table tr:nth-child(even) td { background: #fafafa; }
.cmp-winner { background: #fff3e0 !important; font-weight: 700; }

/* brand colors */
.b-Zanussi   { background: #0066cc; }
.b-Midea     { background: #e53935; }
.b-Unionaire { background: #2e7d32; }
.b-Kiriazi   { background: #00695c; }
.b-Fresh     { background: #c62828; }
.b-Kenwood   { background: #1565c0; }
.b-Premier   { background: #4527a0; }
.b-Purity    { background: #6a1b9a; }
.b-Indesit   { background: #37474f; }
.b-Ariston   { background: #bf360c; }
.b-Gorenje   { background: #558b2f; }
.b-LG        { background: #6a1b9a; }
.b-Beko      { background: #0d47a1; }
.b-Miele     { background: #212121; }
.b-Samsung   { background: #1565c0; }
.b-Haier     { background: #c62828; }
.b-Toshiba   { background: #37474f; }
.b-WhitePoint { background: #2e7d32; }
.b-Armadillo { background: #795548; }
.b-Bosch { background: #b71c1c; }
.b-Sharp { background: #d32f2f; }
.b-Hoover { background: #00838f; }
.b-Hisense { background: #00897b; }
.b-Hitachi { background: #ad1457; }
.b-Tornado { background: #1976d2; }
.b-Candy { background: #ef6c00; }
.b-Alaska { background: #0277bd; }
.b-Passap { background: #5d4037; }
.b-WhiteWhale { background: #006064; }

@media (max-width: 600px) {
  header { padding: 12px 16px; }
  .controls, main { padding: 10px 12px; }
  .cards { grid-template-columns: 1fr 1fr; gap: 10px; }
}

/* ── Mobile ── */
.ftoggle, .fshow { display: none; }
@media (max-width: 700px) {
  html, body { overflow-x: hidden; }
  header { padding: 10px 14px; gap: 6px; }
  header h1 { font-size: 1.05rem; }
  header p { display: none; }
  .header-badges { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .hbadge { flex: 0 0 auto; font-size: .68rem; }
  .tabs { padding: 0 6px; position: sticky; top: 0; z-index: 30; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 10px 11px; font-size: .78rem; }
  /* filters: search always visible, the rest folds behind a button */
  .controls { position: static; padding: 8px 12px; gap: 8px; display: grid; grid-template-columns: 1fr 1fr; align-items: end; }
  .controls .ctrl { min-width: 0 !important; max-width: none !important; }
  .controls .ctrl-search { grid-column: 1 / -1; order: 1; }
  .controls .ftoggle { order: 2; grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 6px;
    padding: 9px; border: 1.5px solid var(--orange); background: var(--orange-light); color: var(--orange);
    border-radius: 10px; font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; }
  .controls .ctrl:not(.ctrl-search) { display: none; order: 3; }
  .controls.open .ctrl:not(.ctrl-search) { display: flex; }
  .controls.open #ctrlMotor[style*="none"], .controls.open #ctrlSpec[style*="none"], .controls.open #ctrlLoad[style*="none"] { display: none !important; }
  .controls .ctrl:has(#priceMin), .controls .ctrl:has(#capMin), .controls .ctrl:has(#discMin), .controls .ctrl:has(#sortBy) { grid-column: 1 / -1; }
  .controls.open .fshow { display: block; order: 4; grid-column: 1 / -1; padding: 12px; border: 0; border-radius: 10px; background: var(--orange); color: #fff; font: inherit; font-weight: 700; font-size: .95rem; position: sticky; bottom: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .controls.open .ftoggle .car { transform: rotate(180deg); }
  .ctrl input, .ctrl select, .ms-btn { font-size: 16px; min-height: 40px; }   /* 16px stops iOS zoom-on-focus */
  .ms-panel { position: fixed; left: 10px; right: 10px; top: auto; bottom: 10px; max-height: 65vh; overflow-y: auto; min-width: 0; z-index: 400; box-shadow: 0 -6px 30px rgba(0,0,0,.35); }
  .stats { padding: 6px 12px; gap: 14px; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .stat-item { flex: 0 0 auto; }
  main { padding: 10px 10px 90px; }
  .rec-panel { margin: 10px 10px 0; padding: 10px; }
  .cards { grid-template-columns: 1fr; gap: 10px; }
  .more-wrap button { width: 100%; }
  .compare-bar { padding: 8px 12px; }
}
/* ── Value recommendation ── */
.rec-panel { margin: 14px 24px 0; background: #fff; border-radius: 12px; border: 2px solid #ffe0b2; padding: 14px 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.rec-head { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.rec-head h3 { font-size: 1rem; color: var(--dark); }
.rec-head small { color: var(--muted, #777); font-size: .72rem; }
.rec-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap: 10px; }
.thumb { position: relative; background: #fff; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #f0f0f0; }
.thumb::before { content: attr(data-ic); position: absolute; opacity: .35; }
.thumb img { position: relative; width: 100%; height: 100%; object-fit: contain; background: #fff; }
.thumb-s { width: 56px; height: 56px; } .thumb-s::before { font-size: 1.4rem; }
.thumb-m { width: 64px; height: 64px; } .thumb-m::before { font-size: 1.6rem; }
.thumb-l { width: 100%; height: 160px; margin: 6px 0 8px; } .thumb-l::before { font-size: 3rem; }
#histWrap .thumb-l { width: 130px; height: 130px; margin: 0 0 0 12px; }
#imgZoom { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 300; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px; color: #fff; cursor: zoom-out; }
#imgZoom.open { display: flex; }
#imgZoom img { max-width: 90vw; max-height: 80vh; background: #fff; border-radius: 10px; padding: 10px; object-fit: contain; }
.rec-card { border-radius: 10px; padding: 12px; background: #fafafa; border: 1px solid #eee; cursor: pointer; }
.rec-card.top { background: linear-gradient(135deg,#fff8e1,#fff3e0); border-color: #ffb74d; }
.rec-label { font-size: .75rem; font-weight: 700; color: var(--orange); margin-bottom: 4px; }
.rec-name { font-weight: 700; font-size: .88rem; margin: 2px 0 4px; line-height:1.4; }
.rec-price { font-size: 1.05rem; font-weight: 800; color: var(--dark); }
.rec-why { margin: 6px 0 0; padding: 0 16px 0 0; font-size: .74rem; color: #555; line-height: 1.6; }
.rec-method { margin-top: 10px; font-size: .74rem; color: #555; }
.rec-method summary { cursor: pointer; color: var(--orange); font-weight: 600; }
.rec-method ul { padding-right: 18px; margin-top: 6px; line-height: 1.8; }
.vscore { display:inline-block; min-width: 38px; text-align:center; padding: 2px 6px; border-radius: 6px; font-weight: 700; font-size: .75rem; color:#fff; }
.vs-hi { background:#2e7d32; } .vs-mid { background:#f9a825; } .vs-lo { background:#9e9e9e; }
.tech2 { font-size: .7rem; color: #6a4c93; margin-top: 3px; line-height: 1.5; }
.stars { color: #f9a825; font-weight: 700; }
tr.best-value td { background: #e8f5e9 !important; }
.card.best-value { outline: 2px solid #2e7d32; }
.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%,40% { background:#c8e6c9; } 100% { background: inherit; } }
.shops-line { font-size:.7rem; margin-top:4px; }
.shops-line a { color:#1565c0; cursor:pointer; text-decoration:underline; }
.pchg { font-size:.7rem; font-weight:700; margin-right:4px; }
.pchg.down { color:#2e7d32; } .pchg.up { color:#c62828; }
.hist-tbl td, .hist-tbl th { padding:6px 8px; border-bottom:1px solid #eee; font-size:.8rem; text-align:right; }
.hist-tbl tr.cheapest td { background:#e8f5e9; font-weight:700; }
.hist-note { font-size:.75rem; color:#777; margin:8px 0; }
.ctrl-row { flex-wrap: wrap; }
.merge-lbl { display:flex; align-items:center; gap:4px; font-size:.78rem; cursor:pointer; white-space:nowrap; }
  .fchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .fchip{background:#fff3e0;color:#e65100;border:1px solid #ffcc80;border-radius:12px;padding:2px 9px;font-size:.72rem}
  .rec-note{font-size:.74rem;color:#666;margin-top:8px}
</style>
</head>
<body>

<header>
  <div>
    <h1>🏠 مقارنة الأجهزة الكهربائية</h1>
    <p id="headerMeta">جاري التحميل...</p>
  </div>
  <div class="header-badges" id="headerBadges"></div>
</header>

<div class="tabs" id="tabs">
  <div class="tab active" data-cat="">الكل</div>
  <div class="tab" data-cat="بوتاجاز">🔥 بوتاجازات</div>
  <div class="tab" data-cat="شفاط">💨 شفاطات</div>
  <div class="tab" data-cat="مسطح غاز">🍳 مسطح غاز</div>
  <div class="tab" data-cat="مسطح كهرباء">⚡ مسطح كهرباء</div>
  <div class="tab" data-cat="فرن">🫙 أفران</div>
  <div class="tab" data-cat="مايكروويف">📡 مايكروويف</div>
  <div class="tab" data-cat="غسالة">🫧 غسالات</div>
  <div class="tab" data-cat="ثلاجة">🧊 ثلاجات</div>
  <div class="tab" data-cat="ديب فريزر">❄️ ديب فريزر</div>
  <div class="tab" data-cat="غسالة أطباق">🍽️ غسالات أطباق</div>
  <div class="tab" data-cat="مجفف">🌀 مجففات</div>
  <div class="tab" data-cat="سخان">🚿 سخانات</div>
  <div class="tab" data-cat="باكدج">📦 باكدجات</div>
</div>

<div class="controls">
  <button type="button" class="ftoggle" id="fToggle" onclick="toggleFilters()">🎛️ فلاتر <span id="fCount"></span> <span class="car">▾</span></button>
  <div class="ctrl ctrl-search" style="min-width:260px;flex:2">
    <label>🔍 بحث ذكي</label>
    <input type="search" id="searchInput" placeholder="مثلاً: غسالة LG 8 كيلو انفرتر تحت 20 الف" autocomplete="off">
    <div class="qhint" id="qHint"></div>
  </div>
  <div class="ctrl"><label>🏷️ الماركة</label><div class="ms" data-key="brand"></div></div>
  <div class="ctrl"><label>🏪 المحل</label><div class="ms" data-key="shop"></div></div>
  <div class="ctrl"><label>✨ المميزات</label><div class="ms" data-key="feat"></div></div>
  <div class="ctrl" id="ctrlLoad"><label>🧺 نوع التحميل</label><div class="ms" data-key="load"></div></div>
  <div class="ctrl" id="ctrlMotor"><label>🔧 الموتور</label><div class="ms" data-key="motor"></div></div>
  <div class="ctrl" id="ctrlSpec"><label id="specLbl">🔩 المواصفة</label><div class="ms" data-key="spec"></div></div>

    <label>⚖️ <span id="capLbl">السعة</span> (<span id="capUnitLbl">كجم</span>)</label>
    <div class="ctrl-row range">
      <input type="number" id="capMin" placeholder="من" min="0" step="any">
      <input type="number" id="capMax" placeholder="إلى" min="0" step="any">

  </div>

    <label>💰 السعر (ج)</label>

      <input type="number" id="priceMin" placeholder="من" min="0" step="500">
      <input type="number" id="priceMax" placeholder="إلى" min="0" step="500">
    </div>
    <div class="presets" id="pricePresets"></div>
  </div>

    <label>🏷️ الخصم %</label>
    <div class="ctrl-row range">
      <input type="number" id="discMin" placeholder="من" min="0" max="100">

      <option value="">افتراضي</option>

<script>
// ─── State ───────────────────────────────────────────────
let ALL = [];
let LATEST = '';   // newest last_seen; scraped listings not seen for 21+ days are treated as gone
let filtered = [];
let view = innerWidth <= 700 ? 'cards' : 'table';
document.getElementById('btnTable').classList.toggle('active', view === 'table');
document.getElementById('btnCards').classList.toggle('active', view === 'cards');
let sortCol = '';
let sortDir = 1;
let compareIds = new Set();
let activeTab = '';

// ─── Load data ───────────────────────────────────────────
fetch('data.json')
  .then(r => r.json())
  .then(json => {
    ALL = json.products;
    LATEST = ALL.reduce((m,d)=> (d.last_seen||'') > m ? d.last_seen : m, '');
    buildGroups();
    document.getElementById('headerMeta').textContent =
      `${json.meta.last_updated} · ${json.meta.note}`;
    buildSmartIndex();
    populateFilters();
    loadHash();
    applyFilters();
  })
  .catch(() => {
    document.getElementById('mainArea').innerHTML =
      '<div class="empty">⚠️ تعذر تحميل data.json — تأكد إن الملف موجود في نفس المجلد</div>';
  });

// ─── Quality & value scoring (washers) ───────────────────
// Brand tier = تقديري: سمعة الماركة + شبكة الصيانة في مصر (مش بيانات رسمية)
const BRAND_TIER = { LG:10, Samsung:9, Gorenje:8, Zanussi:8, Toshiba:7, Beko:7, Hitachi:7, Ariston:7,
                     Haier:6, Midea:6, Hisense:6, Fresh:5, 'White Point':5, Hoover:5, Armadillo:4 };
const MOTOR_LABEL = { dd:'دفع مباشر (DD)', inverter:'انفرتر', universal:'عادي', unknown:'غير محدد' };
const has = (d, re) => re.test((d.features||[]).join(' ') + ' ' + d.name);

function qualityBreakdown(d) {
  if (d.category !== 'غسالة') return null;
  const parts = [];
  const add = (pts, label) => { parts.push([pts, label]); return pts; };
  let q = 0;
  const m = d.motor_class || 'unknown';
  q += add({dd:25, inverter:18, universal:6, unknown:10}[m], `موتور ${MOTOR_LABEL[m]}`);
  const rpm = d.spin_rpm;
  q += add(rpm>=1600?10 : rpm>=1400?8 : rpm>=1200?5 : rpm?3 : 4, rpm?`${rpm} لفة`:'لفات غير معروفة');
  const cap = d.capacity_kg || 0;
  q += add(Math.min(cap*2, 26), `سعة ${cap} كجم`);
  if (has(d,/بخار|steam/i))        q += add(5, 'بخار');
  if (has(d,/wi-?fi|thinq|واي/i))  q += add(3, 'Wi-Fi');
  if (d.dryer_capacity_kg || has(d,/مجفف/)) q += add(6, 'مجفف مدمج');
  if ((d.motor_warranty_years||0) >= 10) q += add(5, 'ضمان موتور 10 سنين');
  const mi = d.made_in || '';
  q += add(/سلوفينيا|إيطاليا|ألمانيا|بولندا/.test(mi)?8 : /تركيا|مصر/.test(mi)?6 : 4, `صناعة: ${mi||'غير محدد'}`);
  q += add(BRAND_TIER[d.brand] ?? 5, `سمعة وصيانة ${d.brand} (تقديري)`);
  if (d.rating) {
    let w = (d.reviews_count||0) >= 3 ? 1 : 0.5;              // تقييمات قليلة = وزن أقل
    if (d.rating_self_hosted) w *= 0.5;                        // تقييمات على موقع الشركة نفسها = نص الوزن
    q += add(Math.round((d.rating-4)*8*w*10)/10, `تقييم ${d.rating}★${d.reviews_count?` (${d.reviews_count})`:''}`);
  }
  return { score: Math.round(q*10)/10, parts };
}
const QMAX = 25+10+26+5+3+6+5+8+10+8;
function quality(d) { const b = qualityBreakdown(d); return b ? b.score : null; }
function valueIdx(d) { const q = quality(d); return (q && d.price_after>0) ? q / (d.price_after/1000) : null; }
function qualityPct(d) { const q = quality(d); return q==null ? null : Math.round(q/QMAX*100); }

// value relative to the best item in the current filter (best = 100)
function valueScores(list) {
  list = list.filter(d => d.in_stock!==false);
  const vals = list.map(valueIdx).filter(v => v!=null);
  const max = vals.length ? Math.max(...vals) : 0;
  const map = new Map();
  list.forEach(d => { const v = valueIdx(d); if (v!=null && max) map.set(d.id, Math.round(v/max*100)); });
  return map;
}
let VS = new Map();
function vsBadge(d) {
  const v = VS.get(d.id);
  if (v==null) return '-';
  return `<span class="vscore ${v>=85?'vs-hi':v>=65?'vs-mid':'vs-lo'}" title="مؤشر القيمة مقابل السعر (الأفضل في الفلتر الحالي = 100)">${v}</span>`;
}
// a spec known for the model in any shop is shown on the cheapest card too (warranty keeps its source shop: it can differ per seller)
function specOfGroup(d, k) {
  if (d[k] != null && d[k] !== '' && d[k] !== 'unknown') return [d[k], null];
  for (const x of groupOf(d)) if (x[k] != null && x[k] !== '' && x[k] !== 'unknown') return [x[k], x.shop];
  return [null, null];
}
function techLine2(d0) {
  const d = Object.assign({}, d0), from = {};
  for (const k of ['loading', 'motor_type', 'dimensions', 'warranty_years', 'motor_warranty_years']) {
    const [v, shop] = specOfGroup(d0, k); if (v != null) { d[k] = v; if (shop) from[k] = shop; }
  }
  const src = k => from[k] ? ` <small>(${esc(from[k])})</small>` : '';
  const bits = [];
  if (d.category === 'غسالة') {
  if (d.loading) bits.push('🧺 تحميل ' + d.loading);
  if (d.motor_type) bits.push('🔧 ' + d.motor_type);
  if (d.made_in) bits.push('🏭 ' + d.made_in + (d.made_in_verified===false && d.made_in!=='غير محدد' ? ' (غير مؤكد)' : ''));
  if (d.drum_material) bits.push('🥁 ' + d.drum_material);
  }
  if (d.warranty_years) bits.push(`🛡️ ضمان ${d.warranty_years} سنين${src('warranty_years')}`);
  if (d.motor_warranty_years) bits.push(`🛡️ ${d.category === 'ثلاجة' || d.category === 'ديب فريزر' ? 'كمبروسر' : 'موتور'} ${d.motor_warranty_years} سنين${src('motor_warranty_years')}`);
  if (d.dimensions) bits.push('📐 ' + d.dimensions);
  if (d.rating) bits.push(`<span class="stars">★ ${d.rating}</span>${d.reviews_count?` (${d.reviews_count})`:''}`);
  return bits.length ? `<div class="tech2">${bits.join(' · ')}</div>` : '';
}

// weighted customer rating (Bayesian): few reviews pull toward 4.3
function ratingScore(d) {
  if (!d.rating || !d.reviews_count) return null;
  const m = 5, C = 4.3, v = d.reviews_count * (d.rating_self_hosted ? 0.5 : 1);
  return (v * d.rating + m * C) / (v + m);
}
function filterSummary() {
  const F = readFilters(), bits = [[activeTab || 'كل الأقسام']];
  for (const k in SEL) SEL[k].forEach(v => bits.push([(FACETS[k].label || (x => x))(v), k, v]));
  const rng = (a, b, u) => `${a != null ? a.toLocaleString() : '0'} – ${b != null ? b.toLocaleString() : '∞'}${u}`;
  if (F.cMin != null || F.cMax != null) bits.push([capUnit() === 'سم' ? 'العرض ' : 'السعة ' + rng(F.cMin, F.cMax, ' ' + capUnit()), 'cap']);
  if (F.pMin != null || F.pMax != null) bits.push(['السعر ' + rng(F.pMin, F.pMax, ''), 'price']);
  if (F.dMin != null || F.dMax != null) bits.push(['خصم ' + rng(F.dMin, F.dMax, '%'), 'disc']);
  if (F.stock) bits.push(['متاح بس', 'stock']);
  if (F.q) bits.push([`بحث: "${F.q}"`, 'q']);
  return bits.map(([t, k, v]) => `<span class="fchip">${esc(t)}${k ? `<span class="x" title="شيل" onclick="removeFilter('${k}', ${v != null ? `'${esc(String(v)).replace(/'/g, "\\'")}'` : 'null'})">✕</span>` : ''}</span>`).join('');
}
function renderRec() {
  const area = document.getElementById('recArea');
  const A = filtered.filter(d => d.price_after>0 && d.in_stock!==false);
  const outN = filtered.filter(d => d.in_stock===false).length;
  if (!A.length) { area.innerHTML = filtered.length ? `<div class="rec-panel"><div class="rec-head"><h3>🤖 ترشيحات الفلتر الحالي</h3><div class="fchips">${filterSummary()}</div></div><div class="rec-note">مفيش منتج متاح بسعر في الفلتر ده${outN?` (${outN} نفذت)`:''}. وسّع الفلتر.</div></div>` : ''; return; }
  const W = A.filter(d => d.category==='غسالة');
  const washersOnly = W.length === A.length;

  const why = d => {
    const qb = qualityBreakdown(d);
    if (!qb) return '';
    const b = qb.parts.filter(p => p[0] > 0).sort((x,y)=>y[0]-x[0]).slice(0,4).map(p=>p[1]);
    return `<ul class="rec-why">${b.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  };
  const card = (label, d, extra='', cls='') => `
    <div class="rec-card ${cls}" onclick="jumpTo(${d.id})">
      <div class="rec-label">${label}</div>
      <div style="float:left;margin-right:8px">${thumb(d, 'm')}</div>
      <span class="brand-badge ${brandClass(d.brand)}">${d.brand}</span> <small>${d.model||''}</small>
      <div class="rec-name">${d.name}</div>
      <div class="rec-price">${d.price_after.toLocaleString()} ج <small style="font-weight:400;font-size:.72rem">· ${d.shop}</small></div>
      <div style="font-size:.74rem;margin-top:3px">${quality(d)!=null?`جودة <b>${qualityPct(d)}/100</b> · قيمة ${vsBadge(d)}`:''}${d.rating?` <span class="stars">★ ${d.rating}</span>${d.reviews_count?` (${d.reviews_count} تقييم)`:''}`:''} ${extra}</div>
      ${why(d)}
    </div>`;

  const cards = [], used = new Set();
  const push = (label, d, extra='', cls='') => { if (d && !used.has(d.id)) { used.add(d.id); cards.push({label, d, extra, cls}); } };

  // the scored pool: washers when the filter has washers, so value/quality are comparable
  const S = W;
  let best = null;
  if (S.length) {
    const byValue   = [...S].sort((a,b) => valueIdx(b)-valueIdx(a));
    const byQuality = [...S].sort((a,b) => quality(b)-quality(a) || a.price_after-b.price_after);
    best = byValue[0];
    const top = byQuality[0];
    push('🏆 أفضل قيمة مقابل السعر', best, '', 'top');
    const diff = top.price_after - best.price_after;
    push('💎 أعلى جودة', top, diff>0?`<br><small>أغلى بـ ${diff.toLocaleString()} ج من الترشيح الأول</small>`:'');
  }
  // top customer rating (any category in the filter)
  const rated = A.filter(d => ratingScore(d) != null).sort((a,b) => ratingScore(b)-ratingScore(a) || a.price_after-b.price_after);
  if (rated.length) {
    const r = rated[0];
    const ex = cards.find(c => c.d.id === r.id);
    if (ex) ex.label += ' + ⭐ أعلى تقييم';
    else push('⭐ أعلى تقييم من العملاء', r, `<br><small>من ${rated.length} منتج عليه تقييمات في الفلتر</small>`);
  }
  if (S.length) {
    const byValue = [...S].sort((a,b) => valueIdx(b)-valueIdx(a));
    push('🥈 بديل قوي', byValue.find(d => !used.has(d.id)));
  }
  const cheapest = [...A].sort((a,b) => a.price_after-b.price_after)[0];
  push('💰 الأرخص', cheapest);
  const disc = A.filter(d => d.price_before>0).sort((a,b) => (b.price_before-b.price_after)-(a.price_before-a.price_after))[0];
  if (disc && !S.length) push('🏷️ أكبر توفير', disc, `<br><small>توفير ${(disc.price_before-disc.price_after).toLocaleString()} ج</small>`);

  if (A.length === 1) cards[0].label = '✅ الاختيار الوحيد المتاح في الفلتر';
  const stockNote = outN ? `<div class="rec-note">${outN} منتج نفذ من المخزن ومش داخل في الترشيح.</div>` : '';
  const noRatings = !rated.length ? '<div class="rec-note">مفيش تقييمات عملاء لأي منتج في الفلتر ده لسه.</div>' : '';
  const scoredNote = (S.length && !washersOnly) ? `<div class="rec-note">الجودة والقيمة محسوبين للغسالات بس (${W.length} غسالة في الفلتر).</div>` : '';

  area.innerHTML = `<div class="rec-panel">
    <div class="rec-head"><h3>🤖 ترشيحات الفلتر الحالي · ${A.length} منتج متاح</h3>
      <div class="fchips">${filterSummary()}</div></div>
    <div class="rec-grid">${cards.map(c => card(c.label, c.d, c.extra, c.cls)).join('')}</div>
    ${noRatings}${scoredNote}${stockNote}
    <details class="rec-method"><summary>إزاي بنحسب الجودة والقيمة والتقييم؟</summary>
      <ul>
        <li><b>الجودة (من 100)</b>: نوع الموتور (دفع مباشر 25، انفرتر 18، غير محدد 10) + اللفات (حتى 10) + السعة (2 لكل كيلو) + بخار 5 + Wi-Fi 3 + مجفف 6 + ضمان موتور 10 سنين 5 + بلد الصنع (أوروبا 8، تركيا/مصر 6، غير محدد 4) + سمعة الماركة وشبكة الصيانة (تقديري، حتى 10) + تقييم العملاء لو موجود.</li>
        <li><b>القيمة</b> = الجودة ÷ السعر. أفضل منتج في الفلتر الحالي بياخد 100 والباقي نسبة منه.</li>
        <li><b>أعلى تقييم</b>: متوسط مرجّح بعدد التقييمات، فمنتج عليه تقييم واحد 5★ مش بيكسب منتج عليه 500 تقييم 4.8★. التقييمات على موقع الشركة نفسها بتاخد نص الوزن.</li>
        <li>البيانات اللي مكتوب جنبها "غير مؤكد" أو "تقديري" ملقيتش لها مصدر رسمي، فخدها كمؤشر بس.</li>
      </ul>
    </details>
  </div>`;
}
// ─── Same model across shops + price history ─────────────
let GROUPS = new Map();          // product_key|category -> [listings] (same model number under another category = different product)
const gk = d => d.product_key ? d.product_key + '|' + d.category : null;
function buildGroups() {
  GROUPS = new Map();
  ALL.forEach(d => { const k = gk(d); if (k) { if (!GROUPS.has(k)) GROUPS.set(k, []); GROUPS.get(k).push(d); } });
}
const stale = d => d.scraped && d.last_seen && LATEST && (Date.parse(LATEST) - Date.parse(d.last_seen)) > 21*864e5;
const avail = d => d.price_after > 0 && d.in_stock !== false && !stale(d);
function groupOf(d) { return gk(d) ? (GROUPS.get(gk(d)) || [d]) : [d]; }
function cheapestOf(list) { const a = list.filter(avail); return a.length ? a.reduce((m,x)=> x.price_after < m.price_after ? x : m) : null; }
function shopsLine(d) {
  const g = groupOf(d);
  const hist = (d.history||[]).length > 1;
  if (g.length < 2 && !hist) return '';
  const c = cheapestOf(g);
  let txt = g.length > 1 ? `🏪 في ${g.length} محلات` : '📈 سجل السعر';
  if (g.length > 1 && c) txt += c.id === d.id ? ' · <b style="color:#2e7d32">دا الأرخص</b>' : ` · الأرخص ${c.price_after.toLocaleString()} (${c.shop})`;
  return `<div class="shops-line"><a onclick="openHistory(${d.id})">${txt}</a></div>`;
}
function priceChange(d) {
  const h = d.history || [];
  if (h.length < 2) return '';
  const prev = h[h.length-2].price, now = h[h.length-1].price;
  if (!prev || !now || prev === now) return '';
  const diff = now - prev;
  return `<span class="pchg ${diff<0?'down':'up'}" title="من ${prev.toLocaleString()} يوم ${h[h.length-2].date}">${diff<0?'▼':'▲'} ${Math.abs(diff).toLocaleString()}</span>`;
}
function mergeSameModel(list) {
  const seen = new Set(), out = [];

let SHOW = 150;                      // rows rendered at once ("اعرض أكتر" adds more)
let LASTF = null;
function applyFilters(keepShow) {
  if (keepShow !== true) SHOW = 150;
  const F = readFilters(); LASTF = F;
  const sort = document.getElementById('sortBy').value || (F.P && F.P.sort) || '';
  const hint = document.getElementById('qHint');
  hint.innerHTML = F.P && F.P.understood.length
    ? '<b style="color:var(--muted)">فهمت:</b> ' + F.P.understood.map(u => `<span>${esc(u)}</span>`).join('') +
      ((F.P.cats.length || F.P.brands.length || F.P.feats.length || F.P.shops.length || F.P.pMin != null || F.P.pMax != null || F.P.cap) ? ' <a onclick="promoteQuery()" title="حوّل الكلام لفلاتر ثابتة">ثبّتها كفلاتر ⤵</a>' : '')
    : '';
  filtered = ALL.filter(d => passes(d, F));
  updateMSButtons();
  renderPresets();
  saveHash();

  if (document.getElementById('mergeToggle').checked) filtered = mergeSameModel(filtered);
  VS = valueScores(filtered);
  const nz = v => v==null ? -1 : v;
  if (sort === 'value_desc')        filtered.sort((a,b) => nz(valueIdx(b)) - nz(valueIdx(a)));
  else if (sort === 'quality_desc') filtered.sort((a,b) => nz(quality(b)) - nz(quality(a)));
  else if (sort === 'price_asc')     filtered.sort((a,b) => (a.price_after||Infinity) - (b.price_after||Infinity));
  else if (sort === 'price_desc')   filtered.sort((a,b) => b.price_after - a.price_after);
  else if (sort === 'disc_desc')    filtered.sort((a,b) => b.discount_pct - a.discount_pct);
  else if (sort === 'brand')        filtered.sort((a,b) => a.brand.localeCompare(b.brand));
  else if (sort === 'saving_desc')  filtered.sort((a,b) => (b.price_before-b.price_after)-(a.price_before-a.price_after));
  else if (sortCol) {
    filtered.sort((a,b) => {
      const av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
      return sortDir * (typeof av==='number' ? av-bv : String(av).localeCompare(String(bv)));
    });
  }

  updateStats();
  render();
}

const RANGE_IDS = ['priceMin','priceMax','capMin','capMax','discMin','discMax'];
function promoteQuery() {
  const P = parseQuery(document.getElementById('searchInput').value), $ = id => document.getElementById(id);
  if (P.cats.length === 1) { const t = document.querySelector(`.tab[data-cat="${CSS.escape(P.cats[0])}"]`);
    if (t) { document.querySelectorAll('.tab').forEach(el => el.classList.remove('active')); t.classList.add('active'); activeTab = P.cats[0]; } }
  P.brands.forEach(b => SEL.brand.add(b)); P.shops.forEach(x => SEL.shop.add(x)); P.feats.forEach(f => f === 'Front Load' ? SEL.load.add('أمامي') : f === 'Top Load' ? SEL.load.add('علوي') : SEL.feat.add(f));
  if (P.pMin != null) $('priceMin').value = P.pMin;
  if (P.pMax != null) $('priceMax').value = P.pMax;
  if (P.cap) { $('capMin').value = P.cap[1]; $('capMax').value = P.cap[1]; }
  if (P.rpm) SEL.spec.add(String(P.rpm));
  if (P.burners) SEL.spec.add('b' + P.burners);
  if (P.sort && !$('sortBy').value) $('sortBy').value = P.sort;
  $('searchInput').value = [...(P.cats.length > 1 ? P.cats : []), ...P.words].join(' ');
  refreshRangeHints(); applyFilters();
}
function showMore() { SHOW += 300; applyFilters(true); }
// nothing matches → which single filter, if removed, brings results back?
function relaxSuggestions() {
  const F = LASTF || readFilters(), out = [];
  const count = skip => ALL.reduce((n, d) => n + (passes(d, F, skip) ? 1 : 0), 0);
  const NAMES = { brand: 'الماركة', shop: 'المحل', feat: 'المميزات', motor: 'الموتور', load: 'التحميل', spec: 'المواصفة' };
  for (const k in SEL) if (SEL[k].size) out.push([`شيل فلتر ${NAMES[k]}`, count(k), `SEL.${k}.clear();applyFilters()`]);
  if (F.pMin != null || F.pMax != null) out.push(['شيل فلتر السعر', count('price'), "removeFilter('price')"]);
  if (F.cMin != null || F.cMax != null) out.push(['شيل فلتر السعة', count('cap'), "removeFilter('cap')"]);
  if (F.dMin != null || F.dMax != null) out.push(['شيل فلتر الخصم', count('disc'), "removeFilter('disc')"]);
  if (F.stock) out.push(['اعرض اللي نفذ كمان', count('stock'), "removeFilter('stock')"]);
  if (F.P) {   // try dropping one understood part of the search sentence
    const P = F.P, fmt = n => n.toLocaleString();
    const parts = [
      ...P.cats.map(c => ['c', c, c]), ...P.brands.map(b => ['b', b, b]), ...P.shops.map(x => ['s', x, x]),
      ...P.feats.map(f => ['f', f, f]),
      ...(P.cap ? [['cap', null, `${P.cap[1]} ${({kg:'كيلو', l:'لتر', cm:'سم'})[P.cap[0]]}`]] : []),
      ...(P.pMin != null || P.pMax != null ? [['p', null, 'السعر']] : []),
      ...(P.words.length ? [['w', null, P.words.join(' ')]] : []),
    ];
    const toText = Q => [...Q.cats, ...Q.brands, ...Q.shops, ...Q.feats,
      Q.cap ? `${Q.cap[1]} ${({kg:'كيلو', l:'لتر', cm:'سم'})[Q.cap[0]]}` : '', Q.burners ? `${Q.burners} شعلات` : '', Q.rpm ? `${Q.rpm} لفه` : '',
      Q.pMin != null && Q.pMax != null ? `بين ${Q.pMin} و ${Q.pMax}` : Q.pMax != null ? `تحت ${Q.pMax}` : Q.pMin != null ? `فوق ${Q.pMin}` : '',
      Q.sort === 'price_asc' ? 'ارخص' : '', ...Q.words].filter(Boolean).join(' ');
    for (const [kind, val, label] of parts) {
      const Q = { ...P, cats: P.cats.filter(x => !(kind === 'c' && x === val)), brands: P.brands.filter(x => !(kind === 'b' && x === val)),
        shops: P.shops.filter(x => !(kind === 's' && x === val)), feats: P.feats.filter(x => !(kind === 'f' && x === val)),
        cap: kind === 'cap' ? null : P.cap, pMin: kind === 'p' ? null : P.pMin, pMax: kind === 'p' ? null : P.pMax, words: kind === 'w' ? [] : P.words };
      const G = { ...F, P: Q };
      const n = ALL.reduce((a, d) => a + (passes(d, G) ? 1 : 0), 0);
      const txt = toText(Q).replace(/'/g, '');
      out.push([`من غير «${label}»`, n, `searchInput.value='${txt}';applyFilters()`]);
    }
  }
  if (F.q) out.push(['امسح البحث', count('q'), "removeFilter('q')"]);
  if (activeTab) { const t = activeTab; activeTab = ''; out.push(['دوّر في كل الأقسام', count(), "document.querySelector('.tab').click()"]); activeTab = t; }
  return out.filter(o => o[1] > 0).sort((a, b) => a[1] - b[1]).slice(0, 4);  // smallest relaxation first
}

// filters live in the URL (#cat=..&brand=a|b&p=1000-20000) so a filtered view can be shared/bookmarked
function saveHash() {
  const F = readFilters(), h = new URLSearchParams();
  if (activeTab) h.set('cat', activeTab);
  for (const k in SEL) if (SEL[k].size) h.set(k, [...SEL[k]].join('|'));
  const r = (a, b) => (a != null || b != null) ? `${a ?? ''}-${b ?? ''}` : null;
  [['p', r(F.pMin, F.pMax)], ['c', r(F.cMin, F.cMax)], ['d', r(F.dMin, F.dMax)]].forEach(([k, v]) => v && h.set(k, v));
  if (F.q) h.set('q', F.q);
  if (F.stock) h.set('stock', '1');
  const s = h.toString();
  history.replaceState(null, '', s ? '#' + s : location.pathname + location.search);
}
function loadHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('cat')) {
    const t = document.querySelector(`.tab[data-cat="${CSS.escape(h.get('cat'))}"]`);
    if (t) { document.querySelectorAll('.tab').forEach(el => el.classList.remove('active')); t.classList.add('active'); activeTab = t.dataset.cat; }

function updateStats() {
  const valid = filtered.filter(d => d.price_after > 0);
  document.getElementById('sTotal').textContent    = filtered.length;
  document.getElementById('sMin').textContent      = valid.length ? Math.min(...valid.map(d=>d.price_after)).toLocaleString() : '-';
  document.getElementById('sMax').textContent      = valid.length ? Math.max(...valid.map(d=>d.price_after)).toLocaleString() : '-';
  document.getElementById('sAvgDisc').textContent  = valid.length ? Math.round(valid.reduce((s,d)=>s+d.discount_pct,0)/valid.length) : '-';
  const saving = valid.filter(d=>d.price_before>0).reduce((s,d)=>s+(d.price_before-d.price_after),0);
  document.getElementById('sTotalSaving').textContent = saving.toLocaleString();
}

    return `<tr data-id="${d.id}" class="${isBV?'best-value':isBest?'best-deal':''}">
      <td>${i+1}${isBV?' 🏆':''}${isBest?' ⭐':''}</td>
      <td onclick="zoomImg(event, ${d.id})" style="cursor:zoom-in;padding:4px">${thumb(d, 's')}</td>
      <td><span class="brand-badge ${brandClass(d.brand)}">${d.brand}</span></td>
      <td style="max-width:220px;line-height:1.4">${d.url?`<a href="${d.url}" target="_blank" rel="noopener" style="color:inherit">${d.name} ↗</a>`:d.name}${d.in_stock===false?' <span class="tag" style="background:#ffebee;color:#c62828">نفذت</span>':''}${d.model?`<br><small style="color:#888">${d.model}</small>`:''}</td>
      <td><span class="tag">${d.category}</span></td>
      <td style="font-size:.72rem;color:#555;max-width:240px">${techSummary(d)}${techLine2(d)}</td>
      <td style="max-width:180px">${featureTags(d.features)}</td>
      <td>${d.price_before>0?`<span class="price-before">${d.price_before.toLocaleString()}</span>`:'-'}</td>
      <td><span class="price-after">${d.price_after>0?d.price_after.toLocaleString()+' ج':'-'}</span>${priceChange(d)}</td>
      <td>${d.discount_pct>0?`<span class="disc-badge">${d.discount_pct}%</span>`:'-'}</td>
      <td style="color:#2e7d32;font-weight:600">${saving(d)}</td>
      <td>${d.shop}${shopsLine(d)}</td>
      <td>${vsBadge(d)}</td>
      <td><input type="checkbox" ${inCmp?'checked':''} onchange="toggleCompare(${d.id})" title="أضف للمقارنة"></td>
    </tr>`;
  }).join('');

  return `<div class="table-wrap"><table>${thead}<tbody>${rows}</tbody></table></div>`;
}

function renderCards() {
  const best = bestByCategory();
  const bestVal = [...VS.entries()].find(([,v]) => v===100)?.[0];
  return `<div class="cards">${filtered.slice(0, SHOW).map(d => {
    const isBest = best[d.category] === d;
    const isBV   = d.id === bestVal;
    const inCmp  = compareIds.has(d.id);
    return `<div class="card ${isBV?'best-value':''}" data-id="${d.id}">
      ${isBV ? '<div class="best-corner" style="background:#2e7d32">🏆 أفضل قيمة</div>' : isBest ? '<div class="best-corner">⭐ أفضل خصم</div>' : ''}
      <div class="card-top">
        <div>
          <div class="card-brand"><span class="brand-badge ${brandClass(d.brand)}">${d.brand}</span></div>
          <div class="card-cat">${d.category}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          ${d.discount_pct>0?`<span class="disc-badge">${d.discount_pct}%</span>`:''}
          <label style="font-size:.7rem;color:var(--muted);cursor:pointer">
            <input type="checkbox" ${inCmp?'checked':''} onchange="toggleCompare(${d.id})"> قارن
          </label>
        </div>
      </div>
      <div onclick="zoomImg(event, ${d.id})" style="cursor:zoom-in">${thumb(d, 'l')}</div>
      <div class="card-name">${d.name}</div>
      <div class="card-price">
        <span class="card-price-after">${d.price_after>0?d.price_after.toLocaleString()+' ج':'-'}</span>${priceChange(d)}
        ${d.price_before>0?`<span class="card-price-before">${d.price_before.toLocaleString()}</span>`:''}
      </div>
      <div class="card-specs">${featureTags(d.features)}</div>
      <div class="card-tech">${techSummary(d)}${techLine2(d)}</div>
      ${VS.has(d.id) ? `<div style="font-size:.74rem;margin-top:6px">جودة <b>${qualityPct(d)}/100</b> · قيمة ${vsBadge(d)} · ${d.shop}</div>` : `<div style="font-size:.72rem;color:#888;margin-top:6px">${d.shop}</div>`}
      ${shopsLine(d)}
    </div>`;
  }).join('')}</div>`;
}

// ─── Sort ────────────────────────────────────────────────
function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  applyFilters();
}

// ─── View toggle ─────────────────────────────────────────
function toggleFilters() { document.querySelector('.controls').classList.toggle('open'); }
function updateFilterCount() {
  const n = Object.values(SEL).reduce((a, x) => a + x.size, 0) + ['priceMin','priceMax','capMin','capMax','discMin','discMax'].filter(i => document.getElementById(i).value).length
    + (document.getElementById('stockOnly').checked ? 1 : 0);
  document.getElementById('fCount').textContent = n ? '(' + n + ')' : '';
}
function setView(v) {
  view = v;
  document.getElementById('btnTable').classList.toggle('active', v==='table');
  document.getElementById('btnCards').classList.toggle('active', v==='cards');
  render();
}

// ─── Tabs ────────────────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  t.classList.add('active');
  activeTab = t.dataset.cat;
  refreshRangeHints();
  applyFilters();
});

// ─── Compare ─────────────────────────────────────────────
function toggleCompare(id) {
  if (compareIds.has(id)) compareIds.delete(id);
  else {
    if (compareIds.size >= 4) { alert('يمكنك مقارنة 4 منتجات كحد أقصى'); return; }
    compareIds.add(id);
  }
  updateCompareBar();
}

function updateCompareBar() {
  const bar   = document.getElementById('compareBar');
  const chips = document.getElementById('compareChips');
  if (compareIds.size === 0) { bar.classList.remove('visible'); return; }
  bar.classList.add('visible');
  chips.innerHTML = [...compareIds].map(id => {
    const d = ALL.find(x => x.id === id);
    return `<div class="compare-chip">${d.brand} - ${d.category}
      <button onclick="toggleCompare(${id}); render()">✕</button></div>`;
  }).join('');
}

function clearCompare() {
  compareIds.clear();
  updateCompareBar();
  render();
}

function openCompareModal() {
  if (compareIds.size < 2) { alert('اختار منتجين على الأقل للمقارنة'); return; }
  const items = [...compareIds].map(id => ALL.find(x => x.id === id));
  const cmpVS = valueScores(items);
  const topQ  = Math.max(...items.map(d => quality(d) ?? -1));

  const rows = [
    ['الماركة',          d => d.brand],
    ['الفئة',            d => d.category],
    ['السعر بعد الخصم', d => d.price_after>0 ? d.price_after.toLocaleString()+' ج' : '-'],
    ['السعر قبل الخصم', d => d.price_before>0 ? d.price_before.toLocaleString()+' ج' : '-'],
    ['الخصم',            d => d.discount_pct+'%'],
    ['التوفير',          d => saving(d)],
    ['السعة / الكجم',   d => d.capacity_kg ? d.capacity_kg+' كجم' : (d.capacity_liters ? d.capacity_liters+' لتر' : (d.oven_capacity_liters ? d.oven_capacity_liters+' لتر' : '-'))],
    ['السرعة',           d => d.spin_rpm ? d.spin_rpm+' RPM' : '-'],
    ['فئة الطاقة',       d => d.energy_class || '-'],
    ['عدد البرامج',      d => d.programs || '-'],
    ['الضوضاء',          d => d.noise_db ? d.noise_db+' dB' : '-'],
    ['الطاقة',           d => d.power_w ? d.power_w+' W' : '-'],
    ['العرض',            d => d.width_cm ? d.width_cm+' سم' : '-'],
    ['عدد الشعلات',      d => d.burners || '-'],
    ['عدد السرعات',      d => d.speeds || '-'],
    ['نوع الموتور',      d => d.motor_type || '-'],
    ['بلد الصنع',        d => d.made_in ? d.made_in + (d.made_in_verified===false && d.made_in!=='غير محدد' ? ' (غير مؤكد)' : '') : '-'],
    ['خامة الحلة',       d => d.drum_material || '-'],
    ['الضمان',           d => d.warranty_years ? d.warranty_years+' سنين' : '-'],
    ['ضمان الموتور/الكمبروسر', d => d.motor_warranty_years ? d.motor_warranty_years+' سنين' : '-'],
    ['الأبعاد',          d => d.dimensions || '-'],
    ['تقييم العملاء',    d => d.rating ? `★ ${d.rating}${d.reviews_count?` (${d.reviews_count} تقييم)`:''} – ${d.rating_source||''}` : 'لا يوجد'],
    ['رأي العملاء',      d => d.review_summary || '-'],
    ['درجة الجودة',      d => qualityPct(d)!=null ? qualityPct(d)+'/100' : '-'],
    ['مؤشر القيمة',      d => { const v = cmpVS.get(d.id); return v!=null ? v+'/100' : '-'; }],
    ['المميزات',         d => (d.features||[]).join(' • ')],
    ['المحل',            d => d.shop],
    ['الاستهلاك السنوي', d => d.annual_kwh ? d.annual_kwh+' ك.و.س' : '-'],
    ['متاح؟',            d => d.in_stock===false ? 'نفذت الكمية' : '-'],
  ];

  // find best price
  const bestPrice = Math.min(...items.filter(d=>d.price_after>0).map(d=>d.price_after));
  const bestDisc  = Math.max(...items.map(d=>d.discount_pct));

  const thead = `<tr><th>البيان</th>${items.map(d=>`<th>${d.brand}<br><span style="font-weight:400;font-size:.7rem">${d.name.slice(0,30)}...</span></th>`).join('')}</tr>`;
  const tbody = rows.map(([label, fn]) => {
    const vals = items.map(fn);
    if (vals.every(v => v==='-' || v==='لا يوجد' || v==='' || v==null)) return '';
    return `<tr><td style="font-weight:600;color:var(--dark)">${label}</td>${items.map((d,i) => {
      const v = vals[i];
      const best = (label==='السعر بعد الخصم' && d.price_after===bestPrice && d.price_after>0)
                || (label==='الخصم' && d.discount_pct===bestDisc)
                || (label==='مؤشر القيمة' && cmpVS.get(d.id)===100)
                || (label==='درجة الجودة' && quality(d)!=null && quality(d)===topQ);
      return `<td class="${best?'cmp-winner':''}">${v}</td>`;
    }).join('')}</tr>`;
  }).join('');

  document.getElementById('compareTableWrap').innerHTML =
    `<div style="overflow-x:auto"><table class="cmp-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
  document.getElementById('compareModal').classList.add('open');
}

function closeCompareModal() {
  document.getElementById('compareModal').classList.remove('open');
}

// ─── Event listeners ─────────────────────────────────────
let _deb;
const debounced = () => { clearTimeout(_deb); _deb = setTimeout(applyFilters, 220); };
['searchInput', ...RANGE_IDS].forEach(id => document.getElementById(id).addEventListener('input', debounced));
['sortBy','mergeToggle','stockOnly'].forEach(id => document.getElementById(id).addEventListener('input', applyFilters));
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(_deb); applyFilters(); } });
</script>
</body>
</html>
